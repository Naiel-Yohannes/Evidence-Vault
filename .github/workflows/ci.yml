name: Evidence Vault CI
on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: Frontend
        run: npm install
      - name: Build app
        working-directory: Frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: Backend
        run: npm install
      - name: Run tests
        working-directory: Backend
        env:
          POSTGRES_URI: ${{ secrets.POSTGRES_URL_TEST }}
          SECRET: ${{ secrets.SECRET }}
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/evidence-vault-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/evidence-vault-backend:${{ github.sha }}

      - name: Deploy to render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}