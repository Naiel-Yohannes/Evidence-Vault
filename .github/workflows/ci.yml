name: Evidence Vault CI
on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: Frontend
        run: npm install
      - name: Build app
        working-directory: Frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: Backend
        run: npm install
      - name: Run tests
        working-directory: Backend
        env:
          POSTGRES_URI: ${{ secrets.POSTGRES_URL_TEST }}
          SECRET: ${{ secrets.SECRET }}
        run: npm test